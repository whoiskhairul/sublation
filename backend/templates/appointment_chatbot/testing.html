<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        /* Style the input container to make it flexible */
        .input-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 526px;
            z-index: 10;
            display: flex;
            align-items: center;
            border-radius: 30px;
            border: 1px solid #ddd;
            background-color: #f9f9f9;
            padding: 5px;
        }

        /* Style the input field to take up remaining space */
        .input-container input {
            flex-grow: 1;
            border: none;
            padding: 10px;
            border-radius: 25px;
            font-size: 16px;
        }

        /* Style the send button */
        .input-container button {
            background-color: #007bff;
            border: none;
            padding: 10px 15px;
            margin-left: 5px;
            border-radius: 25px;
            color: white;
            cursor: pointer;
        }

        .input-container button:hover {
            background-color: #0056b3;
        }

        /* Icons inside the input area */
        .input-container .icon {
            margin: 0 5px;
            color: #007bff;
            cursor: pointer;
        }
    </style>
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
        <img class="mx-4" src="/static/images/Frame 18.svg" alt="Salus Logo" style="height: 30px; margin-right: 10px;">
        <a class="navbar-brand" href="#">Salus</a>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="chat-box d-flex flex-column" id="chat-window">
                    <div class="message-bubble bot-message">
                        <p class="py-4">Hello! I'm Salus, I am here to help you with appointment scheduling. How can I help you?</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Input area with send button inside -->
    <div class="input-container">
        <input type="text" id="user-input" placeholder="Tell Us What You Need">
        <i class="icon bi bi-mic"></i> <!-- Add microphone icon -->
        <i class="icon bi bi-paperclip"></i> <!-- Add attachment icon -->
        <button onclick="sendMessage()">Send</button>
    </div>
    <div class="container m-4 p-4" style="bottom: 0%; left: 0%;">

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <script>
        function scrollToBottom() {
            setTimeout(() => {
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            }, 100); // Small delay to ensure new content is rendered
        }

        // Add event listener to detect Enter key press
        document.getElementById("user-input").addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                sendMessage();
                event.preventDefault(); // Prevent the default Enter behavior
            }
        });

        async function sendMessage() {
            const userMessage = document.getElementById("user-input").value;
            if (!userMessage) return;

            const chatWindow = document.getElementById("chat-window");
            chatWindow.innerHTML += `<div class="message user-message bg-white border rounded-2 py-2 px-4 text-end">${userMessage}</div>`;

            // Clear input
            document.getElementById("user-input").value = "";

            // Scroll the entire page to the bottom
            scrollToBottom();

            try {
                const response = await fetch("/appointment/chat/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: userMessage }),
                });

                const data = await response.json();

                if (data.reply) {
                    chatWindow.innerHTML += `<div class="message bot-message py-2 ">${data.reply}</div>`;
                } else if (data.error) {
                    chatWindow.innerHTML += `<div class="message bot-message py-2 ">Sorry, something went wrong.</div>`;
                }

                // Scroll the entire page to the bottom again after adding bot reply
                scrollToBottom();
            } catch (error) {
                chatWindow.innerHTML += `<div class="message bot-message py-2 ">Sorry, I couldn't process your request.</div>`;
                scrollToBottom();
            }
        }
    </script>
</body>

</html>
